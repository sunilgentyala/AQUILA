[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aquila-quantum"
version = "0.1.0"
description = "Agentic QUantum Interface for Load Allocation - a scalable quantum-classical interface for offloading agentic AI optimization workloads to QAOA, with post-quantum-secured agent messaging"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sunil Gentyala", email = "sunil.gentyala@ieee.org" },
]
keywords = [
    "quantum-computing", "qaoa", "quantum-classical-interface", "agentic-ai",
    "post-quantum-cryptography", "ml-kem", "ml-dsa", "quantum-optimization",
    "hybrid-computing", "multicore-soc", "quantum-simulation", "qiskit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
    "pqcrypto>=0.4",
    "cryptography>=42.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "pydantic>=2.0",
    "networkx>=3.3",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aquila"]

[project.urls]
Homepage      = "https://sunilgentyala.github.io/AQUILA/"
Repository    = "https://github.com/sunilgentyala/AQUILA"
Issues        = "https://github.com/sunilgentyala/AQUILA/issues"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B"]
ignore = ["S101", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
